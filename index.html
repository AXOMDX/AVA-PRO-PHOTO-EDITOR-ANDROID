rame(v){frame=v;render();commit()} function resetAdjust(){Object.keys(base).forEach(k=>base[k]=0);render();commit();openTool('adjust')} function autoEnhance(){base.brightness=8;base.contrast=10;base.saturation=12;base.shadows=8;base.highlights=-6;base.clarity=12;render();commit();toast('Auto Enhance applied')} function resetProject(){if(!projectLoaded)return;rotation=0;flipX=flipY=1;filter='none';frame='none';Object.keys(base).forEach(k=>base[k]=0);objects=[];selectedId=null;render();commit();refreshLayers();toast('Project reset')} function newId(){return Math.random().toString(36).slice(2,10)} function addText(style='fill'){ if(!projectLoaded)return toast('Upload a photo first'); const text=document.getElementById('textInput')?.value.trim();if(!text)return toast('Enter text first'); objects.push({id:newId(),type:'text',text,font:document.getElementById('font').value,size:Number(document.getElementById('textSize').value),color:document.getElementById('textColor').value,bg:document.getElementById('textBg').value,style,x:canvas.width/2,y:canvas.height/2,scale:1,rotation:0,opacity:1}); selectedId=objects.at(-1).id;render();commit();refreshLayers() } function addSticker(text){ if(!projectLoaded)return toast('Upload a photo first'); objects.push({id:newId(),type:'sticker',text:String(text),font:'Arial',size:String(text).length>3?46:100,color:'#fff',x:canvas.width/2,y:canvas.height/2,scale:1,rotation:0,opacity:1}); selectedId=objects.at(-1).id;render();commit();refreshLayers() } function refreshLayers(){ const box=document.getElementById('layers');if(!box)return; box.innerHTML=`<div class="layer ${selectedId==='photo'?'sel':''}" onclick="selectLayer('photo')"><div class="thumb">🖼️</div><div class="name">Photo</div></div>`+ objects.slice().reverse().map(o=>`<div class="layer ${selectedId===o.id?'sel':''}" onclick="selectLayer('${o.id}')"><div class="thumb">${o.type==='text'?'🔤':'😊'}</div><div class="name">${esc(o.text||o.type)}</div><button onclick="event.stopPropagation() function startCrop(){

  if(!projectLoaded) return toast('Upload a photo first');

  const overlay=document.getElementById('cropOverlay');

  const box=document.getElementById('cropBox');

  cropState.active=true;

  cropState.ratio='free';

  const pad=.08;

  cropState.x=canvas.width*pad; cropState.y=canvas.height*pad;

function setCropRatio(ratio){

  if(!cropState.active) startCrop();

  cropState.ratio=ratio;

  const ratios={'1:1':1,'4:5':4/5,'16:9':16/9};

  if(ratio==='free') return syncCropBox();

  const target=ratios[ratio];

  let w=cropState.w,h=w/target;

  if(h>canvas.height){h=cropState.h;w=h*target}

  cropState.w=clamp(w,20,canvas.width);

  cropState.h=clamp(h,20,canvas.height);

  cropState.x=clamp((canvas.width-cropState.w)/2,0,canvas.width-cropState.w);

  cropState.y=clamp((canvas.height-cropState.h)/2,0,canvas.height-cropState.h);

  const sx=Math.round(cropState.x),sy=Math.round(cropState.y);

  const temp=document.createElement('canvas');

  hslChannels.forEach(k=>colorState.hsl[k]={h:0,s:0,l:0});

  colorState.curves={master:[[0,0],[1,1]]};

  colorState.grading={shadows:'#000000',midtones:'#000000',highlights:'#000000',shadowAmount:0,midAmount:0,highlightAmount:0};

  render();commit();openTool('color');toast('Color Studio reset');

}

// Curve editor: master RGB tone curve, stored non-destructively.

function curveReset(){

  colorState.curves={master:[[0,0],[1,1]]};

  initCurveEditor();render();commit();toast('Curve reset');

}

function curveSorted(){

  const pts=colorState.curves.master||[[0,0],[1,1]];

  return pts.slice().sort((a,b)=>a[0]-b[0]);

}

function curveAddPoint(){

  const pts=curveSorted();

  const x=.5;

  let y=.5;

  if(pts.length>1){

    let a=pts[0],b=pts[pts.length-1];

    for(let i=0;i<pts.length-1;i++)if(x>=pts[i][0]&&x<=pts[i+1][0]){a=pts[i];b=pts[i+1];break}

    const t=(x-a[0])/Math.max(.0001,b[0]-a[0]);y=a[1]+(b[1]-a[1])*t;

  }

  if(!pts.some(p=>Math.abs(p[0]-x)<.03)){pts.push([x,y]);colorState.curves.master=pts;initCurveEditor();render();commit()}

}

function curveEvaluate(x){

  const pts=curveSorted();

  if(x<=pts[0][0])return pts[0][1];

  for(let i=0;i<pts.length-1;i++){

    const a=pts[i],b=pts[i+1];

    if(x<=b[0]){

      const t=(x-a[0])/Math.max(.0001,b[0]-a[0]);

      return a[1]+(b[1]-a[1])*t;

    }

  }

  return pts[pts.length-1][1];

}

function initCurveEditor(){

  const c=document.getElementById('curveCanvas');if(!c)return;

  const box=document.getElementById('curveBox');

  const cc=c.getContext('2d');

  function drawCurve(){

    cc.clearRect(0,0,c.width,c.height);

    cc.strokeStyle='#9b8bff';cc.lineWidth=4;cc.beginPath();

    for(let i=0;i<=100;i++){

      const x=i/100,y=curveEvaluate(x);

      const px=x*c.width,py=(1-y)*c.height;

      if(i===0)cc.moveTo(px,py);else cc.lineTo(px,py);

    }

    cc.stroke();

    cc.fillStyle='#fff';

    curveSorted().forEach(p=>{cc.beginPath();cc.arc(p[0]*c.width,(1-p[1])*c.height,6,0,Math.PI*2);cc.fill()});

  }

  drawCurve();

  let drag=null;

  c.onpointerdown=e=>{

    const r=c.getBoundingClientRect(),x=clamp((e.clientX-r.left)/r.width,0,1),y=clamp(1-(e.clientY-r.top)/r.height,0,1);

    const pts=curveSorted();

    let hit=-1,best=.04;

    pts.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<best){best=d;hit=i}});

    if(hit<0){pts.push([x,y]);colorState.curves.master=pts;hit=pts.length-1}

    drag={index:hit};

    c.setPointerCapture?.(e.pointerId);drawCurve();

  };

  c.onpointermove=e=>{

    if(!drag)return;

    const r=c.getBoundingClientRect();

    const pts=colorState.curves.master;

    let p=pts[drag.index];if(!p)return;

    const x=clamp((e.clientX-r.left)/r.width,0,1),y=clamp(1-(e.clientY-r.top)/r.height,0,1);

    // Keep endpoints anchored to make the curve predictable.

    if(p[0]===0){p[0]=0;p[1]=y}

    else if(p[0]===1){p[0]=1;p[1]=y}

    else {p[0]=clamp(x,.01,.99);p[1]=y}

    colorState.curves.master=pts;drawCurve();render();

  };

  c.onpointerup=()=>{if(drag){drag=null;commit()}};

}

// Approximate the tone curve using a compact per-pixel lookup table.

// This is applied after canvas filter rendering without external libraries.

function applyToneCurve(){

  const pts=colorState.curves?.master;

  if(!pts || pts.length<=2)return;

  const lut=new Uint8ClampedArray(256);

  for(let i=0;i<256;i++)lut[i]=Math.round(clamp(curveEvaluate(i/255),0,1)*255);

  const img=ctx.getImageData(0,0,canvas.width,canvas.height);

  const d=img.data;

  for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}

  ctx.putImageData(img,0,0);

}

// Color grading is represented as screen-like tints based on luminance bands.

function hexRgb(hex){

  const n=parseInt(hex.replace('#',''),16);

  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};

}

function applyColorGrade(){

  const g=colorState.grading;if(!g)return;

  const amounts=[g.shadowAmount,g.midAmount,g.highlightAmount];

  if(!amounts.some(Boolean))return;

  const img=ctx.getImageData(0,0,canvas.width,canvas.height),d=img.data;

  const sh=hexRgb(g.shadows),mi=hexRgb(g.midtones),hi=hexRgb(g.highlights);

  for(let i=0;i<d.length;i+=4){

    const lum=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;

    let col,amt;

    if(lum<.33){col=sh;amt=g.shadowAmount/100}

    else if(lum<.66){col=mi;amt=g.midAmount/100}

    else{col=hi;amt=g.highlightAmount/100}

    d[i]=clamp(d[i]*(1-amt)+col.r*amt,0,255);

    d[i+1]=clamp(d[i+1]*(1-amt)+col.g*amt,0,255);

    d[i+2]=clamp(d[i+2]*(1-amt)+col.b*amt,0,255);

  }

  ctx.putImageData(img,0,0);

}

// Replace render with a v4 render pipeline while preserving existing UI behavior.

const renderV3=render;

render=function(){

  renderV3();

  if(!projectLoaded||compareOriginal)return;

  applyToneCurve();

  applyColorGrade();

  updateSelection();

};

// Replace Color tool renderer with the professional studio.

const renderToolV3=renderTool;

renderTool=function(name,el){

};

  });

}

function restore(s){

  const p=JSON.parse(s);

  base=p.base;filter=p.filter;rotation=p.rotation;flipX=p.flipX;flipY=p.flipY;frame=p.frame;

  objects=p.objects||[];selectedId=null;render();refreshLayers();

}

// Ensure reset starts with clean color controls.

const resetProjectV3=resetProject;

resetProject=function(){

};

// HSL is exposed as a real non-destructive state. Browser canvas filter handles

// global color controls; per-channel HSL values are retained for the next GPU shader stage.

function hslStateActive(){

  return hslChannels.some(k=>Object.values(colorState.hsl[k]).some(v=>v!==0));

}
