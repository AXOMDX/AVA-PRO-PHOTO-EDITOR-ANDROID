 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ava Pro — Photo Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080c;--panel:#101218;--panel2:#171a22;--panel3:#20242d;--line:#292e39;--text:#fff;--muted:#9299a8;--accent:#7657ff;--accent2:#9a84ff}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;color:#fff;cursor:pointer}button:active{transform:scale(.98)}
.app{height:100%;display:flex;flex-direction:column}
.header{height:58px;flex:none;background:#0e1016;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#6d50ff,#b59fff);box-shadow:0 8px 24px #7657ff55}
.headBtns{display:flex;gap:6px;align-items:center}.icon{width:37px;height:37px;border-radius:9px;background:var(--panel2);font-size:17px}.export{background:var(--accent);padding:10px 15px;border-radius:9px;font-weight:800}
.main{flex:1;min-height:0;display:flex}.workspace{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#0b0d12;background-image:linear-gradient(45deg,#11141b 25%,transparent 25%),linear-gradient(-45deg,#11141b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#11141b 75%),linear-gradient(-45deg,transparent 75%,#11141b 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}
.empty{text-align:center;color:var(--muted);width:min(860px,calc(100% - 40px));padding:44px 28px;border:1px solid #242a3a;border-radius:28px;background:radial-gradient(circle at 50% 0%,#24185b55,transparent 46%),linear-gradient(145deg,#111522,#0b0e16);box-shadow:0 30px 100px #0008,inset 0 1px 0 #ffffff0d;position:relative;overflow:hidden}.empty:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,#7657ff0b 50%,transparent 80%);pointer-events:none}.emptyIcon{width:88px;height:88px;border:1px solid #6f5cff66;border-radius:24px;background:linear-gradient(145deg,#21165a,#141827);display:grid;place-items:center;font-size:40px;margin:0 auto 18px;box-shadow:0 18px 50px #7657ff33}.empty h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.03em;margin-bottom:10px;color:#fff}.empty h1 span{color:#9b84ff}.empty p{line-height:1.55;margin:0 auto 22px;max-width:650px;font-size:clamp(13px,1.7vw,17px);color:#9da5b8}.empty .uploadHint{font-size:11px;color:#727b90;margin-top:12px}.empty .formats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:15px}.empty .formats span{padding:6px 10px;border:1px solid #2b3141;background:#151925;border-radius:999px;font-size:10px;color:#aeb5c5}.primary{background:linear-gradient(135deg,#7657ff,#5c3ff0);padding:14px 28px;border-radius:12px;font-weight:850;font-size:15px;box-shadow:0 12px 35px #7657ff40;transition:.18s}.primary:hover{transform:translateY(-1px);box-shadow:0 16px 42px #7657ff55}
.stage{display:none;position:relative;align-items:center;justify-content:center;width:100%;height:100%;padding:18px}.canvasWrap{position:relative;max-width:100%;max-height:100%;box-shadow:0 24px 80px #000b}.canvasWrap canvas{display:block;max-width:100%;max-height:calc(100vh - 145px);touch-action:none;background:#fff}.selection{position:absolute;border:2px solid var(--accent);display:none;pointer-events:none}.selection .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}.dot.tl{left:-7px;top:-7px}.dot.tr{right:-7px;top:-7px}.dot.bl{left:-7px;bottom:-7px}.dot.br{right:-7px;bottom:-7px}.rotateDot{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.compare{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:none;background:#11151ccc;border:1px solid var(--line);border-radius:11px;padding:5px;gap:5px;z-index:8}.compare button{background:transparent;padding:7px 11px;border-radius:8px;font-size:11px}.compare .on{background:var(--accent)}
.sidebar{width:360px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.sideTitle{height:48px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--line);font-weight:800}
.toolGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;max-height:190px;overflow:auto;flex:none}.tool{min-height:62px;border-radius:10px;background:var(--panel2);color:#cbd0da;font-size:10px;border:1px solid transparent}.tool b{display:block;font-size:20px;margin-bottom:4px}.tool.active{background:#211b3a;border-color:var(--accent);color:#fff}
.panel{flex:1;min-height:0;overflow:auto;padding:14px}.title{font-weight:900;margin-bottom:14px}.sub{font-size:11px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.08em}.row{margin-bottom:13px}.label{display:flex;justify-content:space-between;font-size:11px;color:#cbd0da;margin-bottom:7px}input[type=range]{width:100%;accent-color:var(--accent)}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{padding:10px;background:var(--panel3);border-radius:8px;font-size:11px}.btn:hover{background:#2a2f3a}.field,.select{width:100%;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;outline:none;margin-bottom:8px}.color{width:100%;height:38px;border:0;background:transparent}
.preset{height:70px;border-radius:9px;background:var(--panel3);overflow:hidden;position:relative;font-size:10px}.presetPreview{height:45px;background:linear-gradient(135deg,#3a3a3a,#9b9b9b)}.preset span{display:block;padding:4px}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px}.chip{white-space:nowrap;padding:7px 10px;border-radius:99px;background:var(--panel3);font-size:10px}.chip.active{background:var(--accent)}
.stickers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sticker{height:48px;border-radius:9px;background:var(--panel3);font-size:23px}
.layer{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:9px;border-radius:8px;margin-bottom:6px;border:1px solid transparent}.layer.sel{border-color:var(--accent)}.layer .thumb{width:28px;text-align:center}.layer .name{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer button{background:transparent;font-size:13px}
.mobile{display:none}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center;padding:18px}.modalBox{width:min(440px,100%);background:#171a21;border:1px solid var(--line);border-radius:16px;padding:20px}.modalBox h2{margin-bottom:16px}.modalActions{display:flex;gap:8px}.modalActions button{flex:1;padding:11px;border-radius:9px}.cancel{background:var(--panel3)}.confirm{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#171a21;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:12px;z-index:200;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){
  .header{height:58px;padding:0 14px}.headBtns .icon{display:none}.export{padding:10px 15px;font-size:12px;border-radius:11px}.brand{font-size:17px}.main{flex-direction:column}.workspace{min-height:0;flex:1}.empty{width:calc(100% - 24px);padding:34px 18px;border-radius:24px}.emptyIcon{width:72px;height:72px;font-size:32px;border-radius:20px;margin-bottom:14px}.empty h1{font-size:30px}.empty p{font-size:14px;margin-bottom:20px}.primary{width:min(310px,100%);padding:14px 22px}.canvasWrap canvas{max-height:calc(100vh - 390px)}.sidebar{width:100%;height:315px;border-left:0;border-top:1px solid var(--line);background:#0e1016;box-shadow:0 -18px 50px #0008}.sideTitle{display:none}.toolGrid{grid-template-columns:repeat(8,66px);max-height:78px;overflow-x:auto;overflow-y:hidden;padding:8px 10px;background:#0e1016}.tool{min-height:58px;border-radius:12px;background:#151922}.tool b{font-size:18px}.panel{padding:12px;background:#101218}.mobile{display:none}.empty .formats{margin-top:13px}.empty .uploadHint{margin-top:10px}
}
</style> 

<style id="ava-upgrade-css">
.cropOverlay{display:none;position:absolute;inset:0;z-index:15;pointer-events:none}
.cropOverlay.on{display:block}
.cropBox{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:auto;touch-action:none}
.cropBox:before,.cropBox:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.28) 33.2%,rgba(255,255,255,.28) 33.7%,transparent 33.7%,transparent 66.2%,rgba(255,255,255,.28) 66.2%,rgba(255,255,255,.28) 66.7%,transparent 66.7%),linear-gradient(0deg,transparent 33.2%,rgba(255,255,255,.28) 33.2%,rgba(255,255,255,.28) 33.7%,transparent 33.7%,transparent 66.2%,rgba(255,255,255,.28) 66.2%,rgba(255,255,255,.28) 66.7%,transparent 66.7%)}
.cropHandle{position:absolute;width:18px;height:18px;border:3px solid #fff;background:var(--accent);border-radius:50%;z-index:2;pointer-events:auto;touch-action:none}
.cropHandle.tl{left:-10px;top:-10px}.cropHandle.tr{right:-10px;top:-10px}.cropHandle.bl{left:-10px;bottom:-10px}.cropHandle.br{right:-10px;bottom:-10px}
.cropBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#11151ce8;padding:6px;border:1px solid var(--line);border-radius:11px;z-index:16}
.cropBar button{padding:8px 11px;border-radius:8px;background:var(--panel3);font-size:11px}.cropBar .apply{background:var(--accent)}
.mobile{scrollbar-width:none}
</style>

<style id="ava-layer-css">
.transformOverlay{display:none;position:absolute;inset:0;z-index:18;pointer-events:none}
.transformOverlay.on{display:block}
.transformBox{position:absolute;border:2px solid var(--accent);pointer-events:none}
.transformBox .th{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);pointer-events:auto;touch-action:none}
.transformBox .tl{left:-9px;top:-9px}.transformBox .tr{right:-9px;top:-9px}
.transformBox .bl{left:-9px;bottom:-9px}.transformBox .br{right:-9px;bottom:-9px}
.transformRotate{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid var(--accent);pointer-events:auto;touch-action:none}
.transformLine{position:absolute;left:50%;top:-25px;width:1px;height:25px;background:var(--accent)}
.transformToolbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#11151ce8;border:1px solid var(--line);border-radius:11px;padding:6px;z-index:19;pointer-events:auto}
.transformToolbar button{background:var(--panel3);padding:8px 10px;border-radius:8px;font-size:10px}
.transformToolbar button.active{background:var(--accent)}
.layerControls{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.opacityRow{margin-top:10px}
.blendSelect{width:100%;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}
.lockedBadge{font-size:10px;color:#ffcc66}
</style>

<style id="ava-color-v4-css">
.colorStudio{display:grid;gap:10px}
.colorCard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.colorCard h4{font-size:11px;margin-bottom:9px}
.hslGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.hslItem{background:var(--panel3);border-radius:8px;padding:8px}
.hslName{font-size:10px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between}
.miniRange{width:100%;margin:2px 0}
.curveBox{height:190px;background:#0a0c11;border:1px solid var(--line);border-radius:9px;position:relative;overflow:hidden;touch-action:none}
.curveBox canvas{width:100%;height:100%;display:block;max-width:none;max-height:none;background:transparent}
.curveGrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:25% 25%}
.gradeWheel{width:100%;height:105px;display:flex;gap:7px}
.gradeWheel button{flex:1;border-radius:99px;background:var(--panel3);font-size:10px}
.gradeWheel input[type=color]{width:100%;height:45px;border:0;background:transparent}
.smallValue{font-size:10px;color:var(--muted)}
.colorReset{width:100%;margin-top:5px}
</style>
</head> 
<body> 
<div class="app"> 
  <header class="header"> 
    <div class="brand"><div class="logo">✦</div>Ava <small style="color:#9b8bff;font-size:9px">PRO</small></div> 
    <div class="headBtns"> 
      <button class="icon" onclick="undo()">↶</button>
      <button class="icon" onclick="redo()">↷</button> 
      <button class="icon" onclick="toggleCompare()">◐</button>
      <button class="icon" onclick="resetProject()">⟳</button> 
      <button class="export" onclick="openExport()">Export</button> 
    </div> 
  </header>

  <main class="main"> 
    <section class="workspace" id="workspace"> 
      <div class="empty" id="empty"> 
        <div class="emptyIcon">🖼️</div>
        <h1>Ava <span>Pro</span></h1> 
        <p>Professional Photo Editing • Creative Effects • AI Tools</p> 
        <label class="primary" for="fileInput" role="button" tabindex="0">＋ Choose Photo</label> 
        <div class="uploadHint">Drag & drop your image here, or click to upload</div> 
        <div class="formats"><span>JPG</span><span>PNG</span><span>WEBP</span><span>High Quality</span></div> 
      </div> 
      <div class="stage" id="stage"> 
        <div class="canvasWrap" id="canvasWrap"> 
          <canvas id="canvas"></canvas> 
          <div class="transformOverlay" id="transformOverlay">
            <div class="transformBox" id="transformBox">
              <i class="th tl" data-handle="tl"></i>
              <i class="th tr" data-handle="tr"></i>
              <i class="th bl" data-handle="bl"></i>
              <i class="th br" data-handle="br"></i>
              <i class="transformLine"></i>
              <i class="transformRotate" id="transformRotate"></i>
            </div>
            <div class="transformToolbar">
              <button onclick="transformDuplicate()">Duplicate</button>
              <button onclick="transformDelete()">Delete</button>
              <button onclick="transformRotateBy(-90)">↺ 90°</button>
              <button onclick="transformRotateBy(90)">↻ 90°</button>
              <button onclick="transformFlipX()">↔ Flip</button>
              <button onclick="transformReset()">Reset</button>
            </div>
          </div>
          <div class="cropOverlay" id="cropOverlay">
            <div class="cropBar">
              <button onclick="setCropRatio('free')">Free</button>
              <button onclick="setCropRatio('1:1')">1:1</button>
              <button onclick="setCropRatio('4:5')">4:5</button>
              <button onclick="setCropRatio('16:9')">16:9</button>
              <button onclick="cancelCrop()">Cancel</button>
              <button class="apply" onclick="applyCrop()">Apply Crop</button>
            </div>
            <div class="cropBox" id="cropBox">
              <i class="cropHandle tl" data-corner="tl"></i>
              <i class="cropHandle tr" data-corner="tr"></i>
              <i class="cropHandle bl" data-corner="bl"></i>
              <i class="cropHandle br" data-corner="br"></i>
            </div>
          </div>
          <div class="selection" id="selection"> 
            <i class="dot tl"></i><i class="dot tr"></i><i class="dot bl"></i><i class="dot br"></i><i class="rotateDot"></i> 
          </div> 
        </div> 
      </div> 
      <div class="compare" id="compare">
        <button class="on" onclick="showEdited()">Edited</button>
        <button onclick="showOriginal()">Original</button>
      </div> 
    </section>

    <aside class="sidebar"> 
      <div class="sideTitle">Professional Tools</div> 
      <div class="toolGrid" id="toolGrid"> 
        <button class="tool active" onclick="openTool('adjust',this)"><b>☀️</b>Light</button> 
        <button class="tool" onclick="openTool('color',this)"><b>🎨</b>Color Studio</button> 
        <button class="tool" onclick="openTool('filters',this)"><b>🖼️</b>Filters</button> 
        <button class="tool" onclick="openTool('effects',this)"><b>✨</b>Effects</button> 
        <button class="tool" onclick="openTool('retouch',this)"><b>🩹</b>Retouch</button> 
        <button class="tool" onclick="openTool('crop',this)"><b>✂️</b>Crop</button> 
        <button class="tool" onclick="openTool('text',this)"><b>🔤</b>Text</button> 
        <button class="tool" onclick="openTool('stickers',this)"><b>😊</b>Stickers</button> 
        <button class="tool" onclick="openTool('shapes',this)"><b>◇</b>Shapes</button> 
        <button class="tool" onclick="openTool('draw',this)"><b>🖌️</b>Draw</button> 
        <button class="tool" onclick="openTool('overlay',this)"><b>▧</b>Overlay</button> 
        <button class="tool" onclick="openTool('frames',this)"><b>▣</b>Frames</button> 
        <button class="tool" onclick="openTool('ai',this)"><b>🤖</b>AI</button> 
        <button class="tool" onclick="openTool('collage',this)"><b>▦</b>Collage</button> 
        <button class="tool" onclick="openTool('layers',this)"><b>▱</b>Layers</button> 
        <button class="tool" onclick="openTool('social',this)"><b>📱</b>Social</button> 
      </div>
      <div class="panel" id="panel"></div> 
    </aside> 
  </main>

  <div class="mobile"> 
    <button onclick="openTool('adjust')"><b>☀️</b>Light</button>
    <button onclick="openTool('color')"><b>🎨</b>Color Studio</button>
    <button onclick="openTool('filters')"><b>🖼️</b>Filters</button>
    <button onclick="openTool('effects')"><b>✨</b>Effects</button>
    <button onclick="openTool('text')"><b>🔤</b>Text</button>
    <button onclick="openTool('stickers')"><b>😊</b>Sticker</button>
    <button onclick="openTool('retouch')"><b>🩹</b>Retouch</button>
    <button onclick="openTool('ai')"><b>🤖</b>AI</button> 
  </div> 
</div>

<input id="fileInput" type="file" accept="image/*" hidden>

<div class="modal" id="exportModal">
  <div class="modalBox"> 
    <h2>Export Ava Photo</h2> 
    <div class="row">
      <div class="label">Format</div>
      <select id="format" class="select">
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WEBP</option>
      </select>
    </div> 
    <div class="row">
      <div class="label">Quality <span id="qualityValue">92%</span></div>
      <input id="quality" type="range" min="10" max="100" value="92">
    </div> 
    <div class="modalActions">
      <button class="cancel" onclick="closeExport()">Cancel</button>
      <button class="confirm" onclick="exportImage()">Save Photo</button>
    </div> 
  </div>
</div> 
<div class="toast" id="toast"></div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'); 
const empty=document.getElementById('empty'),stage=document.getElementById('stage'),wrap=document.getElementById('canvasWrap'); 
const selection=document.getElementById('selection'),fileInput=document.getElementById('fileInput'),panel=document.getElementById('panel'); 
const workspace=document.getElementById('workspace'); 
let image=new Image(), originalSrc='', projectLoaded=false, selectedId=null, compareOriginal=false; 
let base={brightness:0,contrast:0,saturation:0,exposure:0,temperature:0,t
